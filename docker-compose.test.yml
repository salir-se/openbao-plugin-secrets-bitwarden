# Throwaway services for scripts/integration-test.sh.
# Ports are published on localhost only; override them if they are taken:
#   TEST_OPENBAO_PORT=28200 TEST_VAULTWARDEN_PORT=28080 ./scripts/integration-test.sh
name: openbao-plugin-secrets-bitwarden-test

services:
  openbao:
    image: openbao/openbao:latest@sha256:87d715029a47328172774638cabfeb04d5b356678d660621b796b6a671f93581
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=test-root-token
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command: server -dev
    ports:
      - "127.0.0.1:${TEST_OPENBAO_PORT:-18200}:8200"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  vaultwarden:
    image: vaultwarden/server:latest-alpine@sha256:34b4e91ed4c2a4d2191245325608b2a84bedbeb9c9dd561e3c0924b98ef7126c
    environment:
      - DOMAIN=http://localhost:${TEST_VAULTWARDEN_PORT:-18080}
      - SIGNUPS_ALLOWED=true
      - ADMIN_TOKEN=test-admin-token
      - WEBSOCKET_ENABLED=false
      - I_REALLY_WANT_VOLATILE_STORAGE=true
    ports:
      - "127.0.0.1:${TEST_VAULTWARDEN_PORT:-18080}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 5s
      timeout: 3s
      retries: 10
