name: Release

# Pushing a `v*` tag (from main or a release/<major.minor> branch) builds and
# publishes the binaries, archives, SBOMs and checksums.txt to GitHub Releases
# and the plugin image to ghcr.io. Nothing is built or uploaded locally.
# Tags with a pre-release suffix (v0.2.0-beta1, v0.2.0-rc1) become GitHub
# pre-releases and do not move the image's `latest` tag.
#
# "Run workflow" (workflow_dispatch) is a dry run: the same pipeline with
# `goreleaser --snapshot`. Binaries, archives and SBOMs are attached to the
# workflow run, the image is built locally, and nothing is published or signed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Use exactly the toolchain mise installed; never download another one.
  GOTOOLCHAIN: local
  MISE_VERSION: 2026.10.2

jobs:
  # The same gate as CI, so a tag on a red commit cannot ship.
  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: ${{ env.MISE_VERSION }}

      - name: go vet
        run: go vet -tags integration ./...

      - name: Unit tests + coverage gate
        run: mise run cover

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: ./scripts/coverage-summary.sh coverage.out >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Run integration tests
        run: mise run test-integration

  # Known vulnerabilities in dependencies or the Go toolchain block a release.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: ${{ env.MISE_VERSION }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Dry run: build everything, publish nothing.
  snapshot:
    name: Snapshot (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: [test, integration, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # --snapshot never pushes: the image is built per platform and loaded
      # into the local Docker daemon. Signing needs the tag's OIDC identity,
      # so it is skipped here.
      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=sign

      - name: Check the snapshot image
        run: |
          set -euo pipefail
          image="$(docker image ls --format '{{.Repository}}:{{.Tag}}' \
            'ghcr.io/salir-se/openbao-plugin-secrets-bitwarden' | grep -- '-amd64$' | head -n 1)"
          test -n "$image"
          # OpenBao finds the plugin binary through the image's ENTRYPOINT.
          test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" \
            = '["/openbao-plugin-secrets-bitwarden"]'
          docker run --rm "$image" -version
          {
            echo '### Snapshot (nothing published)'
            echo '```'
            docker image ls 'ghcr.io/salir-se/openbao-plugin-secrets-bitwarden'
            echo
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-dist
          path: |
            dist/*.tar.gz
            dist/*.spdx.sbom.json
            dist/plugin_*/openbao-plugin-secrets-bitwarden
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, integration, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push the plugin image to ghcr.io
      id-token: write # OIDC token for keyless cosign and the attestations
      attestations: write # store the build provenance attestations
    env:
      IMAGE: ghcr.io/salir-se/openbao-plugin-secrets-bitwarden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the changelog
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false # never build a release from a restored cache

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds and uploads the release assets, signs checksums.txt, pushes the
      # multi-arch image and signs it by digest (see .goreleaser.yaml).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image digest
        id: image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::could not resolve the digest of ${IMAGE}:${TAG}"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The signature GoReleaser just made must verify against this workflow's
      # identity on this tag - the same command operators are told to run.
      - name: Verify the image signature
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Signed SLSA provenance for every file listed in checksums.txt. Verify:
      #   gh attestation verify <file> --repo salir-se/openbao-plugin-secrets-bitwarden
      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # ... and for the image, stored next to it in the registry. Verify:
      #   gh attestation verify oci://<image>@<digest> --repo salir-se/openbao-plugin-secrets-bitwarden
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # The digest only exists after the push, so the pinned reference is
      # appended to the release notes here.
      - name: Add the pinned image reference to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo '## Pinned image reference'
            echo
            echo '```hcl'
            echo 'plugin "secret" "bitwarden" {'
            echo "  image = \"${IMAGE}:${TAG}@${DIGEST}\""
            echo '}'
            echo '```'
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
