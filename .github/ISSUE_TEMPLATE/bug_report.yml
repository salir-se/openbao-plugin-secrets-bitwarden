name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        - **Security issues do not belong here.** Report them through
          [private vulnerability reporting](https://github.com/salir-se/openbao-plugin-secrets-bitwarden/security/advisories/new).
        - Please write the report in your own words. Using AI to help you debug
          is fine, but label any text here that was generated by AI.
        - Paste text, not screenshots, and remove master passwords, tokens,
          client secrets and vault contents from everything you paste.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The `bao` commands or API calls that trigger the problem, starting from plugin configuration.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected to happen, as text.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead, as text. Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        OpenBao server log lines from the plugin around the failure, with
        secrets removed. For a panic, include the whole stack trace.
      render: text
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Release tag (`openbao-plugin-secrets-bitwarden -version`), or commit SHA if built from source.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: openbao-version
    attributes:
      label: OpenBao version
      description: Output of `bao version`.
      placeholder: OpenBao v2.4.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Bitwarden or Vaultwarden server and version
      placeholder: Vaultwarden 1.34.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - linux/amd64
        - linux/arm64
        - darwin/amd64
        - darwin/arm64
        - other (describe above)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the latest release of the plugin.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets from the text above.
          required: true
        - label: This report is in my own words, and any AI-generated text in it is labelled as such.
          required: true
